name: Verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify shard ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop WebGL and interaction tests
        run: npm run test:e2e -- --project=desktop --shard=${{ matrix.shard }}/2
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Save browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-diagnostics-${{ matrix.shard }}
          path: test-results/
      - run: npm run build
        env:
          VITE_BASE_PATH: /CamLensSim/

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v5
